<script>
const P=n=>(U.role==='customer'?'':'₱')+Number(n).toLocaleString('en-PH'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=86400000;
const TZ='Asia/Manila', dateTime=at=>new Intl.DateTimeFormat('en-PH',{timeZone:TZ,year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(at))+' PHT';
const dayKey=at=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(at));
const groupOf=c=>{const k=c.toLowerCase();if(/pasta/.test(k))return 'Pastas';if(/rice|meal|waffle|grilled cheese/.test(k))return 'Meals';if(/snack|appetizer|side dish|fries/.test(k))return 'Side Dishes';if(/coffee|latte|milk|smoothie|frappe|matcha|tea|beverage|drink|others/.test(k))return 'Beverages';return 'Other categories'};
const categoryLabel=c=>({'Specialty Coffee':'Specialty Latte & Coffee','Classic Coffee':'Classic Latte & Coffee'}[c]||c);
const menuPrice=m=>{const a=Object.values(m.p);return Math.min(...a)==Math.max(...a)?P(a[0]):P(Math.min(...a))+'–'+P(Math.max(...a))};
const sideVariant=m=>{if(groupOf(m.c)!=='Side Dishes'||!m.p.Regular)return null;const f=/^Flavored Fries \((.+)\)$/i.exec(m.n);if(f)return {group:'Flavored Fries',label:f[1]};if(/^Nachos$/i.test(m.n))return {group:'Nachos',label:'Regular'};if(/^Nachos Overload$/i.test(m.n))return {group:'Nachos',label:'Overload'};return null};
const groupedMenu=cat=>{const result=[], groups=new Map();for(const m of S.menu.filter(m=>m.c===cat)){const v=sideVariant(m);if(!v){result.push({id:m.id,n:m.n,p:m.p});continue}let g=groups.get(v.group);if(!g){g={id:m.id,n:v.group,p:{},options:[]};groups.set(v.group,g);result.push(g)}g.options.push({id:m.id,label:v.label});g.p[m.id]=m.p.Regular}return result};
const variantOptions=m=>{const v=sideVariant(m);return v?S.menu.filter(x=>x.c===m.c&&sideVariant(x)?.group===v.group):[]};
const linePrice=(m,a)=>(m.p[a.t]+a.ao.reduce((sum,k)=>sum+AO[k],0))*a.q;
const statusTag=o=>`<span class="status ${o.status}">${esc(LBL[o.status]||o.status)}</span>`;

const AO={Egg:20,Vegetables:20,'Taco Beef':30,Bacon:30};
let S={me:null,sess:null,cfg:{name:'ARK Cafe'},menu:[],cats:[],orders:[],users:[],exp:[]};
const api=async(m,u,b)=>{const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong.');e.status=r.status;throw e}return j};
const load=async()=>{S=await api('GET','/bootstrap');S.sess=S.me?S.me.id:null;S.updatedAt=Date.now()};
const me=()=>S.me;
let U={role:'customer',tab:'menu',cat:'Specialty Coffee',menuQuery:'',productCat:null,productQuery:'',add:null,cart:[],pay:'cash',ref:'',note:'',proof:'',filt:'pending',range:'week',form:null,del:false,msg:''};
const TABS={customer:['menu','cart','orders','account'],employee:['queue','sales','expenses'],admin:['dashboard','products','users','transactions','settings']};
const ST=['pending','confirmed','preparing','ready','received'],LBL={pending:'Pending verification',confirmed:'Confirmed',preparing:'Preparing',ready:'Ready for pickup',received:'Received',rejected:'Rejected'};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const prog=o=>o.status=='rejected'?'':`<div class="step">${ST.map((s,i)=>`<span class="${i<=ST.indexOf(o.status)?'d':''}"></span>`).join('')}</div>`;
const items=o=>o.items.map(i=>`${i.q}× ${esc(i.n)}${i.t!='Regular'?' ('+i.t+')':''}`).join(', ');
const valid=S2=>S2.orders.filter(o=>o.status!='rejected');

const matchesProduct=(m,query)=>m.n.toLowerCase().includes(query);
function productSearchHint(){return U.productCat===null?'Searching all categories':'Searching in '+esc(categoryLabel(U.productCat));}
function productCategoryButtons(){const cats=S.cats, selected=U.productCat;return `<button class="${selected===null?'on':''}" aria-pressed="${selected===null}" data-a="productcat" data-all="1">All Products <span class="category-count">${S.menu.length}</span></button>`+['Beverages','Pastas','Meals','Side Dishes','Other categories'].map(g=>{const list=cats.filter(k=>groupOf(k)===g);return list.length?`<details class="category-group" ${selected===null||list.includes(selected)?'open':''}><summary>${g}</summary>${list.map(k=>`<button class="${selected===k?'on':''}" aria-pressed="${selected===k}" data-a="productcat" data-v="${esc(k)}">${esc(categoryLabel(k))} <span class="category-count">${S.menu.filter(m=>m.c===k).length}</span></button>`).join('')}</details>`:''}).join('');}
function productResults(){const query=U.productQuery.trim().toLowerCase(), selected=U.productCat;const entries=S.cats.map((k,i)=>({k,i})).filter(({k})=>selected===null||k===selected);const count=S.menu.filter(m=>(selected===null||m.c===selected)&&matchesProduct(m,query)).length;const cards=entries.map(({k,i})=>{const L=S.menu.filter(m=>m.c==k&&matchesProduct(m,query));if(query&&!L.length)return '';return `<div class="card"><div class="row" style="flex-wrap:wrap"><b style="font-size:17px">${esc(k)} <span class="mut">· ${L.length} ${L.length==1?'item':'items'}</span></b><span class="seg"><button data-a="newp" data-v="${i}">+ Item</button><button data-a="upc" data-v="${i}" aria-label="Move ${esc(k)} up">↑</button><button data-a="editc" data-v="${i}">Rename</button><button class="out" data-a="delc" data-v="${i}">Delete</button></span></div>${L.length?`<div class="tbl"><table>${L.map(m=>`<tr><td>${esc(m.n)}</td><td>${Object.entries(m.p).map(([t,v])=>(t=='Regular'?'':t+' ')+P(v)).join(' · ')}</td><td style="text-align:right;white-space:nowrap"><button data-a="editp" data-v="${m.id}">Edit</button> <button class="out" data-a="delp" data-v="${m.id}">Remove</button></td></tr>`).join('')}</table></div>`:'<div class="mut">No items yet.</div>'}</div>`}).join('');return `<div class="product-results-heading"><h3>${selected===null?'All Products':esc(categoryLabel(selected))}</h3><span class="mut">${count} ${count===1?'product':'products'}</span></div>`+(cards||'<div class="card mut">'+(query?'No products match your search. Try another name or select All Products.':'No categories yet. Add a category to get started.')+'</div>');}
function updateProductResults(){const results=document.getElementById('product-results');if(!results)return;results.innerHTML=productResults();document.getElementById('product-search-hint').textContent=U.productCat===null?'Searching all categories':'Searching in '+categoryLabel(U.productCat);const clear=document.querySelector('[data-a="clearproductsearch"]');if(clear)clear.disabled=!U.productQuery;}

function menuCategories(){return S.cats.filter(k=>S.menu.some(m=>m.c===k));}
function menuCategoryButtons(){const cats=menuCategories(),selected=U.cat;return `<button class="${selected===null?'on':''}" aria-pressed="${selected===null}" data-a="cat" data-all="1">All Menu</button>`+['Beverages','Pastas','Meals','Side Dishes','Other categories'].map(g=>{const list=cats.filter(k=>groupOf(k)===g);return list.length?`<details ${selected===null||list.includes(selected)?'open':''} class="category-group"><summary>${g}</summary>${list.map(k=>`<button class="${k===selected?'on':''}" aria-pressed="${k===selected}" data-a="cat" data-v="${esc(k)}">${esc(categoryLabel(k))}</button>`).join('')}</details>`:''}).join('');}
function menuResults(){const query=U.menuQuery.trim().toLowerCase(),cats=menuCategories().filter(k=>U.cat===null||U.cat===k);const sections=cats.map(k=>{const list=groupedMenu(k).filter(m=>!query||m.n.toLowerCase().includes(query)||m.options?.some(o=>o.label.toLowerCase().includes(query)||S.menu.find(x=>x.id===o.id)?.n.toLowerCase().includes(query)));return {k,list};}).filter(x=>x.list.length);const count=sections.reduce((n,x)=>n+x.list.length,0);return `<div class="product-results-heading"><h3>${U.cat===null?'All Menu':esc(categoryLabel(U.cat))}</h3><span class="mut">${count} ${count===1?'item':'items'}</span></div>`+(sections.map(({k,list})=>`${U.cat===null?`<h3 class="subheading">${esc(categoryLabel(k))}</h3>`:''}<div class="g menu-grid">${list.map(m=>`<div class="card product-card"><div class="product-name"><strong>${esc(m.n)}:</strong><span class="price">${menuPrice(m)}</span></div><button class="pri" data-a="pick" data-v="${m.id}">Select Order</button></div>`).join('')}</div>`).join('')||`<div class="card mut">${query?'No menu items match your search. Try another name or category.':'No menu items available.'}</div>`);}
function updateMenuResults(){const results=document.getElementById('menu-results');if(!results)return;results.innerHTML=menuResults();document.getElementById('menu-search-hint').textContent=U.cat===null?'Searching all categories':'Searching in '+categoryLabel(U.cat);const clear=document.querySelector('[data-a="clearmenusearch"]');if(clear)clear.disabled=!U.menuQuery;}
function view(){
 const c=U.role;
 if(c=='customer'){
  if(U.tab=='menu'){

return `<div class="dash-head"><div><h2>Dashboard Overview</h2><div class="mut">Last updated: ${dateTime(S.updatedAt||Date.now())}</div></div><button data-a="refreshdash">Refresh data</button></div><div class="kpis">${kpi("Today's sales",P(sum),'sales','Confirmed order value, not settled cash')}${kpi("Today's orders",placed.length,'orders',active.length+' active orders')}${kpi('Average order value',P(today.length?Math.round(sum/today.length*100)/100:0),'average','Confirmed orders today')}${kpi('Top product',top.length?esc(top[0][0]):'—','coffee',top.length?'':'No confirmed orders today',true)}</div><div class="dash-summary"><span>${S.users.length} registered users</span><span>${S.menu.length} menu items</span><span>${active.length} active orders</span></div><div class="row"><h3>Sales analytics</h3></div>${ranges()}<div class="dash-grid">${panel('Orders per period',adminOrderTrend(v))}${panel('Payment breakdown',period.length?`<div class="pay-track" aria-label="Cash ${cash.length}, online ${online.length}"><span style="width:${pct}%"></span><span style="width:${100-pct}%"></span></div><div class="row"><span>Cash orders</span><b>${cash.length} · ${P(cash.reduce((a,o)=>a+o.total,0))}</b></div><div class="row"><span>Online orders</span><b>${online.length} · ${P(online.reduce((a,o)=>a+o.total,0))}</b></div><div class="mut">Confirmed order values by payment method.</div>`:'<div class="chart-empty">No confirmed payments to display.</div>')}</div><div class="dash-grid">${panel('Peak order hours (PHT)',peak?`<div class="kpi-value">${hours.map(h=>String(h).padStart(2,'0')+':00').join(', ')}</div><div class="mut">${peak} confirmed order${peak==1?'':'s'} in each busiest hour of the selected period.</div>`:'<div class="mut">No confirmed orders in this period.</div>')}${panel('Top-selling products',popular.length?popular.map(([n])=>`<div class="row"><span>${esc(n)}</span></div>`).join(''):'<div class="chart-empty">No sales data yet.</div>')}</div><div class="dash-grid">${panel('Recent orders',orderTable(recent))}${panel('Recent confirmed transactions',orderTable(transactions,true))}</div><div class="mut">Analytics are based on the latest 500 orders available from the existing system. Pending and rejected orders are excluded from confirmed sales.</div>`}
function sales(emp){const v=rangeOrders(S.orders.filter(approved),U.range);return `<h2>Online sales</h2>${ranges()}<div class="dash-grid">${panel('Confirmed orders',`<div class="kpi-value">${v.length}</div>`)}${panel('Confirmed order value',`<div class="kpi-value">${P(v.reduce((a,o)=>a+o.total,0))}</div>`)}</div><div class="dash-grid">${panel('Revenue trend',trend(v,'revenue'))}${panel('Top products',best(v).slice(0,5).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join('')||'<div class="mut">No confirmed orders yet.</div>')}</div>`}
function render(){
 const u=me();document.getElementById('bn').textContent=S.cfg.name;
 document.body.classList.toggle('out',!u);if(!u){document.getElementById('roles').innerHTML='';document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=loginView();return}
 U.role=u.role.toLowerCase();if(!TABS[U.role].includes(U.tab))U.tab=TABS[U.role][0];
 document.getElementById('roles').innerHTML=`<span style="align-self:center">${esc(u.name)}</span><button data-a="logout">Log out</button>`;
 document.getElementById('nav').innerHTML=TABS[U.role].map(t=>`<button class="${U.tab==t?'on':''}" data-a="tab" data-v="${t}">${cap(t)}${t=='cart'&&U.cart.length?' ('+U.cart.length+')':''}</button>`).join('');
 document.getElementById('app').innerHTML=view();if(U.role=='customer'&&U.tab=='menu'&&matchMedia('(min-width:701px)').matches)document.querySelectorAll('.category-group').forEach(d=>d.open=true);
}
const A={
refreshdash:async()=>{},
login:async()=>{await api('POST','/login',{email:le.value,password:lp.value});U.msg='';await load();U.cart=[];U.tab=TABS[me().role.toLowerCase()][0]},
signup:async()=>{await api('POST','/signup',{name:ln.value,email:le.value,birthday:lb.value,password:lp.value});U.signup=false;U.msg='';await load();U.tab='menu'},
swap:()=>{U.signup=!U.signup;U.msg=''},
logout:async()=>{await api('POST','/logout');S.me=null;S.sess=null;U.cart=[];U.msg='';U.form=null;U.del=false;U.productCat=null;U.productQuery='';U.menuQuery='';U.cat='Specialty Coffee';U.add=null},
tab:v=>{U.tab=v;U.form=null;U.msg=''},cat:v=>{U.cat=v??null;U.add=null},filt:v=>U.filt=v,range:v=>U.range=v,
pick:v=>{const m=S.menu.find(x=>x.id==v);U.add={id:v,t:Object.keys(m.p)[0],q:1,ao:[]}},temp:v=>U.add.t=v,variant:v=>{const m=S.menu.find(x=>x.id==v);if(m){U.add.id=m.id;U.add.t=Object.keys(m.p)[0]}},
ao:v=>{const x=U.add.ao,i=x.indexOf(v);i<0?x.push(v):x.splice(i,1)},qty:v=>U.add.q=Math.min(20,Math.max(1,U.add.q+ +v)),canceladd:()=>U.add=null,
addcart:()=>{const m=S.menu.find(x=>x.id==U.add.id),ad=[...U.add.ao];U.cart.push({id:m.id,ao:ad,n:m.n+(ad.length?' + '+ad.join(', '):''),t:U.add.t,p:m.p[U.add.t]+ad.reduce((s,k)=>s+AO[k],0),q:U.add.q});U.add=null},
rm:v=>U.cart.splice(v,1),pay:v=>U.pay=v,
place:async()=>{if(!S.cfg.open){U.msg='Online ordering is currently turned off.';return}if(U.pay=='online'&&(!U.ref.trim()||!U.proofData)){U.msg='Please upload your payment screenshot and enter the reference number.';return}
 await api('POST','/orders',{items:U.cart.map(i=>({id:i.id,t:i.t,q:i.q,ao:i.ao})),pay:U.pay,ref:U.ref,note:U.note,proof:U.pay=='online'?U.proofData:null});U.cart=[];U.ref='';U.note='';U.proof='';U.proofData='';U.msg='';U.tab='orders'},
adv:async v=>{await api('POST','/orders/'+v+'/status',{action:'advance'});await load();const o=S.orders.find(x=>x.id==v);if(o)U.filt=o.status},
rej:async v=>{await api('POST','/orders/'+v+'/status',{action:'reject'})},
recv:async v=>{await api('POST','/orders/'+v+'/status',{action:'receive'})},
addexp:async()=>{await api('POST','/expenses',{item:ei.value,amount:ea.value})},
saveacct:async()=>{await api('PUT','/account',{name:an.value,email:ae.value,password:ap.value,birthday:ab.value});U.msg='Saved.'},
del:()=>U.del=true,nodel:()=>U.del=false,
delacct:async()=>{await api('DELETE','/account');S.me=null;S.sess=null;U.del=false;U.cart=[]},
newp:v=>U.form={k:'p',d:v!=null&&v!==''?{c:S.cats[v]}:{c:U.productCat||S.cats[0]}},editp:v=>U.form=JSON.parse(JSON.stringify({k:'p',d:S.menu.find(m=>m.id==v)})),cf:()=>U.form=null,
savep:async()=>{const p={};[[fh,'Hot'],[fi,'Iced'],[fr,'Regular']].forEach(([e,k])=>{if(+e.value>0)p[k]=+e.value});const d=U.form.d;await api(d.id?'PUT':'POST','/products'+(d.id?'/'+d.id:''),{name:fn.value,category:fc.value,prices:p});U.form=null;U.msg=''},
delp:async v=>{await api('DELETE','/products/'+v)},
newu:()=>U.form={k:'u',d:{role:'Customer'}},editu:v=>U.form={k:'u',d:{...S.users.find(u=>u.id==v)}},
saveu:async()=>{const d=U.form.d;if(!d.id&&up.value.length<8){U.msg='A password of 8+ characters is required for new users.';return}await api(d.id?'PUT':'POST','/users'+(d.id?'/'+d.id:''),{name:un.value,email:ue.value,password:up.value,role:ur.value});U.form=null;U.msg=''},
delu:async v=>{const user=S.users.find(u=>u.id==v);if(!user)return;if(!confirm('Delete the account of '+user.name+'? This action cannot be undone.'))return;await api('DELETE','/users/'+v);U.msg='Account deleted.'},
newc:()=>{U.msg='';U.form={k:'c',d:{}}},editc:v=>{U.msg='';U.form={k:'c',d:{old:S.cats[v],name:S.cats[v]}}},
savec:async()=>{const n=cn.value.trim(),d=U.form.d;if(!n){U.msg='Enter a category name.';return}await api(d.old?'PUT':'POST','/categories',{name:n,old:d.old});if(d.old&&U.cat==d.old)U.cat=n;if(d.old&&U.productCat===d.old)U.productCat=n;U.form=null;U.msg=''},
delc:async v=>{await api('DELETE','/categories',{name:S.cats[v]});U.msg=''},
upc:async v=>{await api('POST','/categories/up',{name:S.cats[v]})},
tog:async v=>{await api('PUT','/settings',{[v]:!S.cfg[v]})},
qrdel:async()=>{await api('DELETE','/settings/qr');U.msg='QR image removed.'},
savecfg:async()=>{await api('PUT','/settings',{name:sn.value,hours:sh.value,qr:sq.value,payinfo:sp.value});U.msg='Settings saved.'}};
const LOCAL=new Set(['swap','tab','cat','filt','range','pick','temp','variant','ao','qty','canceladd','addcart','rm','pay','del','nodel','newp','editp','cf','newu','editu','newc','editc']);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='clearmenusearch'){U.menuQuery='';const input=document.getElementById('menu-search');input.value='';updateMenuResults();input.focus();return}
 if(a==='productcat'){U.productCat=b.dataset.all?null:b.dataset.v;document.querySelectorAll('[data-a="productcat"]').forEach(el=>{const active=el.dataset.all?U.productCat===null:el.dataset.v===U.productCat;el.classList.toggle('on',active);el.setAttribute('aria-pressed',String(active))});updateProductResults();return}
 if(a==='clearproductsearch'){U.productQuery='';const input=document.getElementById('product-search');input.value='';updateProductResults();input.focus();return}
 b.disabled=true;
 try{await A[a](a==='cat'&&b.dataset.all?null:b.dataset.v);if(!LOCAL.has(a)&&S.me)await load()}catch(err){U.msg=esc(err.message);if(err.status==401){S.me=null;S.sess=null}}
 render();if(a=='pick')document.getElementById('customize')?.scrollIntoView({block:'nearest'});if(/^(newp|editp|newc|editc)$/.test(a))scrollTo(0,0)});
document.addEventListener('input',e=>{if(e.target.id==='menu-search'){const wasEmpty=!U.menuQuery.trim();U.menuQuery=e.target.value;if(wasEmpty&&U.menuQuery.trim()&&U.cat!==null){U.cat=null;document.getElementById('menu-category-buttons').innerHTML=menuCategoryButtons()}updateMenuResults();return}if(e.target.id==='product-search'){U.productQuery=e.target.value;updateProductResults();return}const f=e.target.dataset.f;if(f=='ref')U.ref=e.target.value;if(f=='note')U.note=e.target.value;if(e.target.id=='le')U.le=e.target.value});
document.addEventListener('change',e=>{if(e.target.dataset.f=='qrimg'){const f=e.target.files[0];if(!f)return;if(f.size>2e6){U.msg='That image is over 2 MB.';render();return}const r=new FileReader();r.onload=async()=>{try{await api('POST','/settings/qr',{image:r.result});await load();U.msg='QR image saved.'}catch(err){U.msg=esc(err.message)}render()};r.readAsDataURL(f);return}
if(e.target.dataset.f!='proof')return;const f=e.target.files[0];U.proof=f?f.name:'';U.proofData='';if(!f)return;if(f.size>2e6){U.proof='';U.msg='That image is over 2 MB. Choose a smaller screenshot.';render();return}const r=new FileReader();r.onload=()=>{U.proofData=r.result};r.readAsDataURL(f)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&!S.me&&e.target.tagName=='INPUT'){const b=document.querySelector('[data-a=login],[data-a=signup]');if(b)b.click()}});
function loginView(){const su=U.signup;return `<div style="text-align:center"><img src="/logo.png" alt="ARK Cafe" style="width:130px;height:130px;object-fit:contain"></div><div class="card" style="max-width:400px;margin:8px auto 20px"><h2>${su?'Create account':'Sign in'}</h2>`+(su?'<label>Name<input id="ln" autocomplete="name"></label>':'')+`<label>Email<input id="le" type="email" autocomplete="username" value="${esc(U.le||'')}"></label>`+(su?'<label>Birthday<input id="lb" type="date"></label>':'')+'<label>Password<input id="lp" type="password" autocomplete="current-password"></label>'+(su?'<div class="mut" style="margin-bottom:10px">By creating an account you agree that this cafe may collect and use your name, email and birthday to process your orders and manage your account, in line with the Data Privacy Act of 2012 (RA 10173).</div>':'')+(U.msg?`<div class="red" style="margin-bottom:8px">${U.msg}</div>`:'')+`<button class="pri" style="width:100%" data-a="${su?'signup':'login'}">${su?'Create account':'Sign in'}</button><button style="width:100%;margin-top:8px" data-a="swap">${su?'I already have an account':'New customer? Create an account'}</button>`+'</div>'}
// ---- auto-refresh: orders update by themselves; screens with form fields are never redrawn under you ----
const WATCH={queue:1,sales:1,transactions:1,dashboard:1,orders:1};let seen=null,seenFor=null;
const sig=(o,open)=>JSON.stringify([open,o.map(x=>x.id+x.status)]);
const beep=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.25)}catch{}};
let polling=false;let dashboardDate=dayKey(Date.now());
async function poll(){if(!S.me||document.hidden||polling)return;polling=true;
 try{const d=await api('GET','/orders');if(!S.me)return;const dateChanged=dashboardDate!==dayKey(Date.now());dashboardDate=dayKey(Date.now());
  if(S.me.role!='Customer'){if(seenFor!=S.me.id){seen=null;seenFor=S.me.id}const ids=new Set(d.orders.filter(o=>o.status=='pending').map(o=>o.id));if(seen&&[...ids].some(i=>!seen.has(i)))beep();seen=ids;document.title=(ids.size?'('+ids.size+') ':'')+(S.cfg.name||'ARK Cafe')}
  if(sig(d.orders,d.open)!=sig(S.orders,S.cfg.open)){S.orders=d.orders;S.cfg.open=d.open;S.updatedAt=Date.now();if(WATCH[U.tab]&&!U.form)render()}else if(dateChanged&&U.role==='admin'&&U.tab==='dashboard'){S.updatedAt=Date.now();render()}}
 catch(err){if(err.status==401){S.me=null;S.sess=null;render()}}finally{polling=false}}
setInterval(poll,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
load().catch(()=>{}).finally(render);
</script></body></html>
